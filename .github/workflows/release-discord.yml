name: Discord release notification

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send release message to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
          URL: ${{ github.event.release.html_url }}
        run: |
          jq -n \
            --arg role "$ROLE_ID" \
            --arg tag "$TAG" \
            --arg body "$BODY" \
            --arg url "$URL" \
            '{
              content: "# [Creatine \($tag)](<\($url)>)\n<@&\($role)> a new version of Creatine has been released!",
              allowed_mentions: {roles: [$role]},
              embeds: (if ($body | length) > 0
                then [{description: ($body | .[0:3500]), color: 8240102}]
                else [] end)
            }' \
          | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK"

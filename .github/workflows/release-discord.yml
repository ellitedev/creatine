name: Discord release notification

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send release message to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
          URL: ${{ github.event.release.html_url }}
        run: |
          jq -n \
            --arg role "$ROLE_ID" \
            --arg repo "$REPO" \
            --arg tag "$TAG" \
            --arg body "$BODY" \
            --arg url "$URL" \
            '{
              content: "# [Creatine \($tag)](<\($url)>)\n<@&\($role)> a new version of Creatine has been released!",
              allowed_mentions: {roles: [$role]},
              embeds: [{
                author: {
                  name: "GitHub",
                  url: "https://github.com",
                  icon_url: "https://avatars.githubusercontent.com/u/9919?s=200&v=4"
                },
                title: "Release \($tag) · \($repo)",
                url: $url,
                description: ((if ($body | length) > 0 then ($body | .[0:3500]) + "\n" else "" end)
                  + "## [Download `Creatine.\($tag).mrpack`](https://github.com/\($repo)/releases/download/\($tag)/Creatine.\($tag).mrpack)"),
                color: 14243683
              }]
            }' \
          | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK"

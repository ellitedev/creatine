[changelog]
header = ""
body = """
{% if version %}\
# {{ version }}
{% else %}\
# unreleased
{% endif %}
## Changes

{% for commit in commits %}\
{% set lines = commit.message | split(pat="\n") %}\
- {{ lines | first | trim | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/ellitedev/creatine/commit/{{ commit.id }}))
{% for line in lines | slice(start=1) %}\
{% if line | trim %}  > {{ line | trim }}
{% endif %}\
{% endfor %}\
{% endfor %}\
{% if version and previous and previous.version %}
**Full Changelog**: [{{ previous.version }}...{{ version }}](https://github.com/ellitedev/creatine/compare/{{ previous.version }}...{{ version }})
{% endif %}\
"""
trim = true
render_always = true
postprocessors = []

[git]
# treat every commit as plain text so messages are never rewritten or split
conventional_commits = false
filter_unconventional = false
require_conventional = false
split_commits = false
commit_preprocessors = []
protect_breaking_commits = false
commit_parsers = [
    { message = "^Merge", skip = true },
    { message = "(?i)^(init git-cliff|v[0-9.]+ init)", skip = true },
    { message = "(?i)^ignore cliff", skip = true },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^chore\\(pr\\)", skip = true },
    { message = "^chore\\(pull\\)", skip = true },
    { message = ".*", group = "Changes" },
]
filter_commits = false
fail_on_unmatched_commit = false
link_parsers = []
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false
